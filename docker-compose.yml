services:

  mysql:
    image: mysql:5.7
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"

  springboot:
    build: ./backend/appforsale
    container_name: springboot-container
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/appdb
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_USERNAME: jayagadwala339@gmail.com
      MAIL_PASSWORD: root
    depends_on:
      - mysql

  frontend:
    build: .
    container_name: frontend-container
    working_dir: /app
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - springboot

